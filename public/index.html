<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#07070c" />
<title>YouTube Downloader</title>
<style>
  :root {
    --bg: #07070c;
    --card: rgba(255,255,255,.065);
    --card-2: rgba(0,0,0,.35);
    --stroke: rgba(255,255,255,.12);
    --stroke-2: rgba(255,255,255,.22);
    --text: #f5f5f7;
    --muted: rgba(245,245,247,.62);
    --faint: rgba(245,245,247,.42);
    --accent: #ff2d55;
    --accent-2: #7c3aed;
    --ok: #34d399;
    --warn: #fbbf24;
    --err: #ff5470;
    --shadow: 0 30px 80px rgba(0,0,0,.55);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
    color: var(--text);
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 16px 40px;
    overflow-x: hidden;
  }
  .bg {
    position: fixed; inset: -20%; z-index: -2;
    background:
      radial-gradient(60% 45% at 18% 8%, rgba(255,45,85,.42), transparent 70%),
      radial-gradient(55% 45% at 88% 12%, rgba(124,58,237,.42), transparent 70%),
      radial-gradient(45% 40% at 50% 108%, rgba(255,45,85,.18), transparent 70%);
    filter: blur(6px);
    animation: drift 18s ease-in-out infinite alternate;
  }
  .bg::after {
    content: ''; position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,.08) 1px, transparent 1px);
    background-size: 26px 26px;
    mask-image: radial-gradient(circle at 50% 30%, #000, transparent 72%);
    opacity: .5;
  }
  @keyframes drift {
    from { transform: translate3d(-2%, -1%, 0) scale(1.02); }
    to   { transform: translate3d(3%, 2%, 0) scale(1.06); }
  }

  .app { width: 100%; max-width: 720px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; padding: 0 4px; }
  .brand { font-size: 21px; font-weight: 800; letter-spacing: -.02em; display: flex; align-items: center; gap: 9px; }
  .brand .logo {
    display: grid; place-items: center; width: 32px; height: 32px; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    font-size: 14px; color: #fff; box-shadow: 0 6px 18px rgba(255,45,85,.35);
  }
  .status { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
  .status .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--err); box-shadow: 0 0 0 4px rgba(255,84,112,.14); }

  .card {
    background: linear-gradient(180deg, rgba(255,255,255,.075), rgba(255,255,255,.035));
    border: 1px solid var(--stroke);
    border-radius: 24px;
    padding: 26px;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: var(--shadow);
  }

  .input-row { display: flex; gap: 10px; }
  .field {
    flex: 1; display: flex; align-items: center; gap: 4px; min-width: 0;
    background: var(--card-2); border: 1px solid var(--stroke); border-radius: 14px;
    padding: 4px 6px 4px 14px; transition: border-color .15s, box-shadow .15s;
  }
  .field:focus-within { border-color: rgba(255,45,85,.7); box-shadow: 0 0 0 4px rgba(255,45,85,.12); }
  .field input { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: var(--text); font-size: 15px; padding: 12px 0; }
  .field input::placeholder { color: var(--faint); }
  .icon-btn {
    border: 0; background: transparent; color: var(--muted); cursor: pointer;
    font-size: 13px; padding: 8px 9px; border-radius: 9px; line-height: 1; transition: background .15s, color .15s;
  }
  .icon-btn:hover { background: rgba(255,255,255,.09); color: var(--text); }
  .fetch-btn {
    border: 0; cursor: pointer; border-radius: 14px; padding: 0 22px; font-weight: 800;
    font-size: 15px; background: #fff; color: #0b0b12; transition: transform .15s, opacity .15s; white-space: nowrap;
  }
  .fetch-btn:hover { transform: translateY(-1px); }
  .fetch-btn:disabled { opacity: .6; cursor: wait; transform: none; }

  .hidden { display: none !important; }

  .error {
    margin-top: 14px; padding: 12px 14px; border-radius: 12px; font-size: 13.5px;
    background: rgba(255,84,112,.12); border: 1px solid rgba(255,84,112,.4); color: #ffd7de;
  }
  .error .hint { display: block; margin-top: 4px; color: rgba(255,215,222,.75); font-size: 12.5px; }

  .skeleton { margin-top: 18px; display: flex; gap: 16px; align-items: center; }
  .sk-media, .sk-line {
    background: linear-gradient(90deg, rgba(255,255,255,.07) 25%, rgba(255,255,255,.16) 37%, rgba(255,255,255,.07) 63%);
    background-size: 400% 100%; animation: shimmer 1.2s ease infinite;
  }
  @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
  .sk-media { width: 168px; height: 94px; border-radius: 12px; flex: none; }
  .sk-lines { flex: 1; display: grid; gap: 10px; }
  .sk-line { height: 14px; border-radius: 7px; }
  .sk-line.w70 { width: 70%; } .sk-line.w40 { width: 40%; }

  .preview { margin-top: 20px; display: flex; gap: 16px; align-items: flex-start; }
  .media {
    position: relative; width: 200px; aspect-ratio: 16/9; flex: none;
    border-radius: 12px; overflow: hidden; background: #000; border: 1px solid var(--stroke);
  }
  .media img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .media .play {
    position: absolute; inset: 0; margin: auto; width: 52px; height: 52px; border-radius: 50%;
    border: 0; cursor: pointer; color: #fff; font-size: 18px; padding-left: 4px;
    background: rgba(0,0,0,.55); backdrop-filter: blur(6px);
    display: grid; place-items: center; transition: transform .15s, background .15s;
  }
  .media .play:hover { transform: scale(1.08); background: var(--accent); }
  .media iframe { width: 100%; height: 100%; border: 0; display: block; }
  .media .badge {
    position: absolute; top: 8px; left: 8px; background: var(--accent); color: #fff;
    font-size: 10px; font-weight: 800; letter-spacing: .08em; padding: 3px 7px; border-radius: 6px;
  }
  .details { min-width: 0; flex: 1; }
  .details h2 { margin: 2px 0 6px; font-size: 17px; line-height: 1.3; }
  .channel { color: var(--muted); font-size: 13px; text-decoration: none; }
  .channel:hover { color: var(--text); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip {
    font-size: 11.5px; color: var(--muted); background: rgba(255,255,255,.06);
    border: 1px solid var(--stroke); border-radius: 999px; padding: 3px 9px;
  }
  .audio-preview { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
  .ghost-btn {
    align-self: flex-start; border: 1px solid var(--stroke-2); background: rgba(255,255,255,.05);
    color: var(--text); cursor: pointer; font-size: 12.5px; padding: 7px 12px; border-radius: 10px; transition: background .15s;
  }
  .ghost-btn:hover { background: rgba(255,255,255,.11); }
  audio { width: 100%; height: 34px; }

  .download-box { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--stroke); }
  .download-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .seg { display: inline-flex; padding: 4px; background: rgba(255,255,255,.06); border: 1px solid var(--stroke); border-radius: 12px; }
  .seg button {
    border: 0; background: transparent; color: var(--muted); padding: 8px 20px; border-radius: 9px;
    font-weight: 700; font-size: 13px; cursor: pointer; transition: background .15s, color .15s;
  }
  .seg button.active { background: #fff; color: #0b0b12; }
  .seg button:disabled { opacity: .35; cursor: not-allowed; }
  .hint-small { font-size: 12px; color: var(--faint); }

  .select-wrap { position: relative; margin-bottom: 12px; }
  .select-wrap select {
    width: 100%; appearance: none; -webkit-appearance: none; cursor: pointer;
    background: var(--card-2); color: var(--text); border: 1px solid var(--stroke);
    border-radius: 12px; padding: 13px 40px 13px 14px; font-size: 14.5px; outline: none;
  }
  .select-wrap select:focus { border-color: rgba(255,45,85,.6); }
  .select-wrap::after {
    content: '▾'; position: absolute; right: 15px; top: 50%; transform: translateY(-50%);
    pointer-events: none; color: var(--muted);
  }

  .download-btn {
    width: 100%; border: 0; cursor: pointer; border-radius: 14px; padding: 15px;
    font-size: 16px; font-weight: 800; color: #fff;
    background: linear-gradient(135deg, var(--accent), #e11d48 55%, var(--accent-2));
    box-shadow: 0 12px 30px rgba(255,45,85,.28);
    transition: transform .15s, opacity .15s, filter .15s;
  }
  .download-btn:hover { transform: translateY(-1px); filter: brightness(1.06); }
  .download-btn:disabled { opacity: .55; cursor: not-allowed; transform: none; }
  .cancel-btn {
    width: 100%; margin-top: 8px; border: 1px solid var(--stroke-2); background: transparent;
    color: var(--muted); cursor: pointer; border-radius: 12px; padding: 10px; font-size: 13px;
  }
  .cancel-btn:hover { color: var(--text); background: rgba(255,255,255,.06); }

  .progress-wrap { margin-top: 14px; }
  .progress { height: 8px; border-radius: 99px; background: rgba(255,255,255,.1); overflow: hidden; }
  .bar { height: 100%; width: 0%; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .18s ease; }
  .progress.indeterminate .bar { width: 35%; animation: indet 1.1s ease-in-out infinite; }
  @keyframes indet { 0% { margin-left: -35%; } 100% { margin-left: 100%; } }
  .progress-meta { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--faint); margin-top: 6px; }

  .history { margin-top: 22px; }
  .history-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .history h3 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--faint); }
  .clear-history { border: 0; background: transparent; color: var(--faint); font-size: 12px; cursor: pointer; }
  .clear-history:hover { color: var(--text); }
  .history-list { display: grid; gap: 8px; }
  .hist-item {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    background: rgba(255,255,255,.045); border: 1px solid var(--stroke); border-radius: 12px;
    padding: 8px; cursor: pointer; color: var(--text); transition: background .15s, border-color .15s;
  }
  .hist-item:hover { background: rgba(255,255,255,.09); border-color: var(--stroke-2); }
  .hist-item img { width: 58px; height: 33px; border-radius: 6px; object-fit: cover; flex: none; background: #000; }
  .hist-item .ht { font-size: 13px; font-weight: 600; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .hist-item .ha { font-size: 11.5px; color: var(--faint); margin-top: 2px; }

  .foot { margin-top: 18px; text-align: center; font-size: 11.5px; color: var(--faint); }

  .toasts { position: fixed; right: 18px; bottom: 18px; display: grid; gap: 8px; z-index: 50; }
  .toast {
    min-width: 200px; max-width: 340px; padding: 12px 14px; border-radius: 12px; font-size: 13px;
    background: rgba(20,20,28,.94); border: 1px solid var(--stroke-2); color: var(--text);
    box-shadow: 0 16px 40px rgba(0,0,0,.5); animation: toastIn .22s ease;
  }
  .toast.success { border-color: rgba(52,211,153,.5); }
  .toast.error { border-color: rgba(255,84,112,.55); }
  .toast .th { display: block; font-weight: 700; margin-bottom: 2px; }
  .toast .td { color: var(--muted); font-size: 12px; }
  @keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  @media (max-width: 560px) {
    .card { padding: 20px; }
    .input-row { flex-direction: column; }
    .fetch-btn { padding: 13px; width: 100%; }
    .preview { flex-direction: column; }
    .media { width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    .bg, .sk-media, .sk-line, .bar, .toast { animation: none !important; }
  }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>

<main class="app">
  <header class="top">
    <div class="brand"><span class="logo">▶</span> YouTube Downloader</div>
    <div class="status hidden" id="health"><span class="dot"></span><span id="healthText">Offline</span></div>
  </header>

  <section class="card" id="dropZone">
    <div class="input-row">
      <div class="field">
        <input id="url" type="text" inputmode="url" autocomplete="off" autocapitalize="off"
               spellcheck="false" placeholder="Paste a YouTube link" aria-label="YouTube URL" />
        <button id="pasteBtn" class="icon-btn" title="Paste from clipboard" aria-label="Paste">Paste</button>
        <button id="clearBtn" class="icon-btn hidden" title="Clear" aria-label="Clear">✕</button>
      </div>
      <button id="fetchBtn" class="fetch-btn" type="button">Fetch</button>
    </div>

    <div id="error" class="error hidden" role="alert"></div>

    <div id="skeleton" class="skeleton hidden" aria-hidden="true">
      <div class="sk-media"></div>
      <div class="sk-lines">
        <div class="sk-line w70"></div>
        <div class="sk-line w40"></div>
        <div class="sk-line"></div>
      </div>
    </div>

    <div id="preview" class="preview hidden">
      <div class="media" id="media">
        <img id="thumb" alt="" />
        <button id="playBtn" class="play" type="button" aria-label="Play video preview">▶</button>
        <span id="liveBadge" class="badge hidden">LIVE</span>
      </div>
      <div class="details">
        <h2 id="title"></h2>
        <a id="channel" class="channel" target="_blank" rel="noopener noreferrer"></a>
        <div class="chips">
          <span id="chipDuration" class="chip"></span>
          <span id="chipViews" class="chip"></span>
          <span id="chipDate" class="chip"></span>
        </div>
        <div class="audio-preview">
          <button id="audioToggle" class="ghost-btn" type="button">🎧 Listen first</button>
          <audio id="audio" controls preload="none" class="hidden"></audio>
        </div>
      </div>
    </div>

    <div id="downloadBox" class="download-box hidden">
      <div class="download-head">
        <div class="seg" role="tablist" aria-label="Download type">
          <button id="tabAudio" class="active" type="button" role="tab" aria-selected="true">Audio</button>
          <button id="tabVideo" type="button" role="tab" aria-selected="false">Video</button>
        </div>
        <span class="hint-small" id="optHint"></span>
      </div>

      <div class="select-wrap">
        <select id="formatSelect" aria-label="Choose download format"></select>
      </div>

      <button id="downloadBtn" class="download-btn" type="button">Download <span id="dlLabel"></span></button>
      <button id="cancelBtn" class="cancel-btn hidden" type="button">Cancel download</button>
      <div id="progressWrap" class="progress-wrap hidden">
        <div class="progress" id="progress"><div id="progressBar" class="bar"></div></div>
        <div class="progress-meta"><span id="progressText">0%</span><span id="progressSize"></span></div>
      </div>
    </div>
  </section>

  <section id="historySection" class="history hidden">
    <div class="history-head">
      <h3>Recent</h3>
      <button id="clearHistory" class="clear-history" type="button">clear</button>
    </div>
    <div id="history" class="history-list"></div>
  </section>

  <footer class="foot">Private · no uploads · files save to your device</footer>
</main>

<div id="toasts" class="toasts" aria-live="polite"></div>

<script>
(() => {
  'use strict';

  const $ = (sel, root = document) => root.querySelector(sel);
  const el = {
    url: $('#url'), pasteBtn: $('#pasteBtn'), clearBtn: $('#clearBtn'), fetchBtn: $('#fetchBtn'),
    error: $('#error'), skeleton: $('#skeleton'), preview: $('#preview'),
    media: $('#media'), thumb: $('#thumb'), playBtn: $('#playBtn'), liveBadge: $('#liveBadge'),
    title: $('#title'), channel: $('#channel'),
    chipDuration: $('#chipDuration'), chipViews: $('#chipViews'), chipDate: $('#chipDate'),
    audioToggle: $('#audioToggle'), audio: $('#audio'),
    downloadBox: $('#downloadBox'), tabAudio: $('#tabAudio'), tabVideo: $('#tabVideo'),
    optHint: $('#optHint'), formatSelect: $('#formatSelect'),
    downloadBtn: $('#downloadBtn'), dlLabel: $('#dlLabel'),
    cancelBtn: $('#cancelBtn'), progressWrap: $('#progressWrap'), progress: $('#progress'),
    progressBar: $('#progressBar'), progressText: $('#progressText'), progressSize: $('#progressSize'),
    health: $('#health'), healthText: $('#healthText'),
    historySection: $('#historySection'), history: $('#history'), clearHistory: $('#clearHistory'),
    toasts: $('#toasts'), dropZone: $('#dropZone'),
  };

  const state = {
    info: null,
    url: '',
    lastFetched: '',
    kind: 'audio',
    fetchAbort: null,
    dlAbort: null,
    fetchTimer: null,
  };

  // ------------------------------------------------------------ utilities ---
  const show = (n) => n.classList.remove('hidden');
  const hide = (n) => n.classList.add('hidden');

  function parseInput(input) {
    if (!input) return null;
    let s = String(input).trim();
    if (!s) return null;
    if (/^[\w-]{11}$/.test(s)) return { url: 'https://www.youtube.com/watch?v=' + s, id: s };
    if (!/^https?:\/\//i.test(s)) s = 'https://' + s;
    let u;
    try { u = new URL(s); } catch { return null; }
    const host = u.hostname.toLowerCase().replace(/^www\./, '');
    const allowed = ['youtube.com', 'm.youtube.com', 'music.youtube.com', 'youtube-nocookie.com', 'youtu.be'];
    if (!allowed.includes(host)) return null;
    let id = null;
    if (host === 'youtu.be') id = u.pathname.split('/').filter(Boolean)[0];
    else if (u.pathname === '/watch') id = u.searchParams.get('v');
    else {
      const m = u.pathname.match(/^\/(?:shorts|embed|live|v)\/([\w-]{11})/);
      if (m) id = m[1];
    }
    if (!id || !/^[\w-]{11}$/.test(id)) return null;
    return { url: 'https://www.youtube.com/watch?v=' + id, id };
  }

  const fmtDuration = (s) => {
    s = Math.max(0, Math.floor(Number(s) || 0));
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    return h > 0
      ? `${h}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`
      : `${m}:${String(sec).padStart(2, '0')}`;
  };
  const fmtViews = (n) => {
    n = Number(n) || 0;
    if (n >= 1e9) return (n / 1e9).toFixed(n >= 1e10 ? 0 : 1).replace(/\.0$/, '') + 'B';
    if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 0 : 1).replace(/\.0$/, '') + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(n >= 1e4 ? 0 : 1).replace(/\.0$/, '') + 'K';
    return String(n);
  };
  const fmtDate = (ymd) => {
    if (!ymd || ymd.length !== 8) return '';
    const d = new Date(`${ymd.slice(0,4)}-${ymd.slice(4,6)}-${ymd.slice(6,8)}T00:00:00Z`);
    if (isNaN(d)) return '';
    return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
  };
  const fmtBytes = (n) => {
    n = Number(n) || 0;
    if (n < 1024) return `${n} B`;
    const units = ['KB','MB','GB'];
    let i = -1;
    do { n /= 1024; i++; } while (n >= 1024 && i < units.length - 1);
    return `${n.toFixed(n >= 10 ? 0 : 1)} ${units[i]}`;
  };

  function toast(message, type = 'info', title) {
    const box = document.createElement('div');
    box.className = 'toast ' + type;
    if (title) {
      const h = document.createElement('span');
      h.className = 'th';
      h.textContent = title;
      box.appendChild(h);
    }
    const d = document.createElement('span');
    d.className = 'td';
    d.textContent = message;
    box.appendChild(d);
    el.toasts.appendChild(box);
    setTimeout(() => {
      box.style.opacity = '0';
      box.style.transition = 'opacity .25s';
      setTimeout(() => box.remove(), 260);
    }, type === 'error' ? 6500 : 3800);
  }

  function setError(message, hint) {
    el.error.textContent = message;
    if (hint) {
      const s = document.createElement('span');
      s.className = 'hint';
      s.textContent = hint;
      el.error.appendChild(s);
    }
    show(el.error);
  }
  const clearError = () => { el.error.textContent = ''; hide(el.error); };

  // -------------------------------------------------------------- health ----
  async function checkHealth() {
    try {
      const r = await fetch('/api/health', { cache: 'no-store' });
      if (!r.ok) throw new Error('bad status');
      const d = await r.json();
      if (!d.ok) throw new Error('not ready');
      hide(el.health);
    } catch {
      show(el.health);
      el.healthText.textContent = 'Offline — start the server';
    }
  }

  // -------------------------------------------------------------- preview ---
  function resetMedia() {
    const frame = el.media.querySelector('iframe');
    if (frame) frame.remove();
    el.media.classList.remove('playing');
    show(el.thumb);
    show(el.playBtn);
  }

  function renderInfo(d, ms) {
    el.thumb.onerror = () => {
      el.thumb.onerror = null;
      el.thumb.src = `https://i.ytimg.com/vi/${d.videoId}/hqdefault.jpg`;
    };
    el.thumb.src = d.thumbnail || `https://i.ytimg.com/vi/${d.videoId}/hqdefault.jpg`;
    el.title.textContent = d.title || 'Unknown title';
    el.channel.textContent = d.author || '';
    if (d.channelUrl) el.channel.href = d.channelUrl; else el.channel.removeAttribute('href');
    el.chipDuration.textContent = d.lengthSeconds ? fmtDuration(d.lengthSeconds) : '';
    el.chipViews.textContent = d.views ? fmtViews(d.views) + ' views' : '';
    el.chipDate.textContent = d.uploadDate ? fmtDate(d.uploadDate) : '';
    el.chipDuration.classList.toggle('hidden', !d.lengthSeconds);
    el.chipViews.classList.toggle('hidden', !d.views);
    el.chipDate.classList.toggle('hidden', !d.uploadDate);
    el.liveBadge.classList.toggle('hidden', !d.isLive);
    el.media.dataset.videoId = d.videoId;
    resetMedia();

    el.audio.pause();
    el.audio.removeAttribute('src');
    el.audio.load();
    hide(el.audio);
    el.audioToggle.textContent = '🎧 Listen first';

    state.kind = 'audio';
    populateFormats();
    show(el.preview);
    show(el.downloadBox);
    el.downloadBtn.disabled = !!d.isLive;
    if (d.isLive) setError('Live streams can be downloaded after they end.');
    if (ms != null) toast(`Loaded in ${ms} ms`, 'success', 'Ready');
  }

  el.playBtn.addEventListener('click', () => {
    const id = el.media.dataset.videoId;
    if (!id) return;
    resetMedia();
    const frame = document.createElement('iframe');
    frame.src = `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0&modestbranding=1`;
    frame.title = 'Video preview';
    frame.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
    frame.allowFullscreen = true;
    frame.referrerPolicy = 'strict-origin-when-cross-origin';
    el.media.appendChild(frame);
    el.media.classList.add('playing');
    hide(el.thumb);
    hide(el.playBtn);
  });

  el.thumb.addEventListener('click', () => el.playBtn.click());

  el.audioToggle.addEventListener('click', () => {
    if (!state.url) return;
    if (el.audio.classList.contains('hidden')) {
      el.audio.src = '/api/stream?url=' + encodeURIComponent(state.url);
      show(el.audio);
      el.audio.play().catch(() => {});
      el.audioToggle.textContent = '🎧 Hide preview';
    } else {
      el.audio.pause();
      hide(el.audio);
      el.audioToggle.textContent = '🎧 Listen first';
    }
  });

  el.audio.addEventListener('error', () => {
    if (el.audio.getAttribute('src')) {
      toast('Could not load the preview. Try downloading instead.', 'error');
      hide(el.audio);
      el.audioToggle.textContent = '🎧 Listen first';
    }
  });

  // --------------------------------------------------------------- fetch ----
  async function fetchInfo(input, { force = false } = {}) {
    const parsed = parseInput(input);
    if (!parsed) {
      setError('That does not look like a YouTube link.', 'Paste a youtube.com / youtu.be URL.');
      return;
    }
    if (!force && state.info && state.lastFetched === parsed.url) return;

    clearError();
    hide(el.preview);
    hide(el.downloadBox);
    show(el.skeleton);
    el.fetchBtn.disabled = true;
    el.fetchBtn.textContent = '…';

    if (state.fetchAbort) state.fetchAbort.abort();
    const ac = new AbortController();
    state.fetchAbort = ac;
    const started = performance.now();

    try {
      const r = await fetch('/api/info', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url: parsed.url }),
        signal: ac.signal,
      });
      const ct = r.headers.get('content-type') || '';
      const data = ct.includes('application/json') ? await r.json().catch(() => ({})) : {};
      if (!r.ok) {
        const offline = !ct.includes('application/json');
        const err = new Error(
          data.error || (offline ? 'Server not reachable.' : `Request failed (${r.status})`)
        );
        err.hint =
          data.hint ||
          (offline ? 'Start it with npm start and open http://localhost:3000.' : '');
        throw err;
      }
      state.info = data;
      state.url = parsed.url;
      state.lastFetched = parsed.url;
      renderInfo(data, Math.round(performance.now() - started));
      addHistory(data);
    } catch (e) {
      if (e.name === 'AbortError') return;
      setError(e.message || 'Could not load this video.', e.hint);
      hide(el.preview);
      hide(el.downloadBox);
    } finally {
      if (state.fetchAbort === ac) {
        hide(el.skeleton);
        el.fetchBtn.disabled = false;
        el.fetchBtn.textContent = 'Fetch';
      }
    }
  }

  // -------------------------------------------------------------- formats ---
  const AUDIO_OPTIONS = [
    { value: 'mp3:320', label: 'MP3 · 320 kbps (best)' },
    { value: 'mp3:192', label: 'MP3 · 192 kbps' },
    { value: 'mp3:128', label: 'MP3 · 128 kbps' },
    { value: 'original', label: 'Original audio · best quality' },
  ];

  function populateFormats() {
    const info = state.info;
    if (!info) return;
    const hasVideo = Array.isArray(info.videoOptions) && info.videoOptions.length > 0;
    el.tabVideo.disabled = !hasVideo;
    el.optHint.textContent = hasVideo ? '' : 'No video formats for this video';

    el.tabAudio.classList.toggle('active', state.kind === 'audio');
    el.tabVideo.classList.toggle('active', state.kind === 'video');
    el.tabAudio.setAttribute('aria-selected', String(state.kind === 'audio'));
    el.tabVideo.setAttribute('aria-selected', String(state.kind === 'video'));

    el.formatSelect.textContent = '';

    if (state.kind === 'video') {
      const opts = info.videoOptions.slice().sort((a, b) => b.height - a.height || b.fps - a.fps);
      for (const o of opts) {
        const option = document.createElement('option');
        option.value = `video:${o.height}:${o.fps}`;
        option.textContent = `${o.label} · MP4${o.estimatedSize ? ' · ~' + fmtBytes(o.estimatedSize) : ''}`;
        el.formatSelect.appendChild(option);
      }
      const preferred = opts.find((o) => o.height === 720) || opts[0];
      if (preferred) el.formatSelect.value = `video:${preferred.height}:${preferred.fps}`;
    } else {
      for (const o of AUDIO_OPTIONS) {
        const option = document.createElement('option');
        option.value = o.value;
        option.textContent = o.label;
        el.formatSelect.appendChild(option);
      }
      el.formatSelect.value = 'mp3:192';
    }
    updateDownloadLabel();
  }

  function updateDownloadLabel() {
    const v = el.formatSelect.value || '';
    const info = state.info;
    let label = '';
    if (v.startsWith('mp3:')) label = `MP3 · ${v.split(':')[1]} kbps`;
    else if (v === 'original') label = 'Original audio';
    else if (v.startsWith('video:')) {
      const [, h, f] = v.split(':');
      const o = (info?.videoOptions || []).find(
        (x) => String(x.height) === h && String(x.fps) === f
      );
      label = `${o ? o.label : h + 'p'} · MP4`;
    }
    el.dlLabel.textContent = label;
  }

  el.tabAudio.addEventListener('click', () => {
    if (state.kind === 'audio') return;
    state.kind = 'audio';
    populateFormats();
  });
  el.tabVideo.addEventListener('click', () => {
    if (state.kind === 'video') return;
    state.kind = 'video';
    populateFormats();
  });
  el.formatSelect.addEventListener('change', updateDownloadLabel);

  // ------------------------------------------------------------ download ----
  function setProgress(received, total, label) {
    if (total > 0) {
      const pct = Math.min(100, Math.round((received / total) * 100));
      el.progress.classList.remove('indeterminate');
      el.progressBar.style.width = pct + '%';
      el.progressText.textContent = pct + '%';
      el.progressSize.textContent = `${fmtBytes(received)} / ~${fmtBytes(total)}`;
    } else {
      el.progress.classList.add('indeterminate');
      el.progressBar.style.width = '';
      el.progressText.textContent = label || 'Starting…';
      el.progressSize.textContent = received ? fmtBytes(received) : '';
    }
  }

  function filenameFrom(disposition, fallback) {
    if (!disposition) return fallback;
    const m = /filename\*?=(?:UTF-8'')?"?([^";]+)"?/i.exec(disposition);
    if (!m) return fallback;
    try { return decodeURIComponent(m[1]).trim() || fallback; } catch { return m[1].trim() || fallback; }
  }

  function saveBlob(blob, filename) {
    const href = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = href;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(href), 30000);
  }

  async function startDownload() {
    if (!state.info || !state.url || state.dlAbort) return;
    if (state.info.isLive) {
      toast('Live streams can be downloaded after they end.', 'info');
      return;
    }
    clearError();

    const value = el.formatSelect.value || 'mp3:192';
    const params = new URLSearchParams({ url: state.url });
    let isVideo = false;
    let fallbackExt = 'mp3';

    if (value === 'original') {
      params.set('format', 'original');
      fallbackExt = state.info.sourceExt || 'm4a';
    } else if (value.startsWith('video:')) {
      const [, height, fps] = value.split(':');
      isVideo = true;
      params.set('format', 'video');
      params.set('height', height);
      if (fps && fps !== '0') params.set('fps', fps);
      fallbackExt = 'mp4';
    } else {
      const [, quality] = value.split(':');
      params.set('format', 'mp3');
      params.set('quality', quality || '192');
      fallbackExt = 'mp3';
    }

    state.dlAbort = new AbortController();
    el.downloadBtn.disabled = true;
    el.formatSelect.disabled = true;
    el.tabAudio.disabled = true;
    el.tabVideo.disabled = true;
    show(el.cancelBtn);
    show(el.progressWrap);
    setProgress(0, 0, isVideo ? 'Preparing video…' : 'Starting…');

    try {
      const r = await fetch('/api/download?' + params.toString(), { signal: state.dlAbort.signal });
      if (!r.ok) {
        const ct = r.headers.get('content-type') || '';
        const text = await r.text().catch(() => '');
        let msg = `Download failed (${r.status})`, hint = '';
        if (ct.includes('application/json')) {
          try {
            const j = JSON.parse(text);
            msg = j.error || msg;
            hint = j.hint || '';
          } catch { /* ignore */ }
        } else if (text) {
          msg = text.slice(0, 220);
        }
        const err = new Error(msg);
        err.hint = hint;
        throw err;
      }

      const total = Number(r.headers.get('X-Estimated-Size') || r.headers.get('Content-Length') || 0);
      const type = r.headers.get('Content-Type') || (isVideo ? 'video/mp4' : 'audio/mpeg');
      const filename = filenameFrom(
        r.headers.get('Content-Disposition'),
        `${state.info.title || 'download'}.${fallbackExt}`
      );

      const reader = r.body.getReader();
      const chunks = [];
      let received = 0;
      let lastPaint = 0;

      setProgress(0, total, 'Starting…');

      for (;;) {
        const { done, value: chunk } = await reader.read();
        if (done) break;
        chunks.push(chunk);
        received += chunk.length;
        const now = performance.now();
        if (now - lastPaint > 80) {
          lastPaint = now;
          setProgress(received, total);
        }
      }

      setProgress(received, received);
      const blob = new Blob(chunks, { type });
      if (!blob.size) throw new Error('The server returned an empty file.');
      saveBlob(blob, filename);
      toast(`${filename} · ${fmtBytes(blob.size)}`, 'success', 'Downloaded');
    } catch (e) {
      if (e.name === 'AbortError') {
        toast('Download cancelled.', 'info');
      } else {
        toast(e.message || 'Download failed.', 'error');
        if (e.hint) setError(e.message, e.hint);
      }
    } finally {
      state.dlAbort = null;
      el.downloadBtn.disabled = !!state.info?.isLive;
      el.formatSelect.disabled = false;
      el.tabAudio.disabled = false;
      el.tabVideo.disabled = !(state.info?.videoOptions || []).length;
      hide(el.cancelBtn);
      setTimeout(() => hide(el.progressWrap), 1600);
    }
  }

  el.downloadBtn.addEventListener('click', startDownload);
  el.cancelBtn.addEventListener('click', () => state.dlAbort && state.dlAbort.abort());

  // -------------------------------------------------------------- history ---
  const HKEY = 'ytmp3.history.v1';

  function loadHistory() {
    try { return JSON.parse(localStorage.getItem(HKEY) || '[]'); } catch { return []; }
  }
  function saveHistory(items) {
    try { localStorage.setItem(HKEY, JSON.stringify(items.slice(0, 10))); } catch { /* ignore */ }
  }
  function addHistory(info) {
    const items = loadHistory().filter((x) => x.videoId !== info.videoId);
    items.unshift({
      videoId: info.videoId, url: info.url, title: info.title,
      author: info.author, thumbnail: info.thumbnail, at: Date.now(),
    });
    saveHistory(items);
    renderHistory();
  }
  function renderHistory() {
    const items = loadHistory();
    if (!items.length) { hide(el.historySection); return; }
    show(el.historySection);
    el.history.textContent = '';
    for (const item of items) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'hist-item';
      btn.addEventListener('click', () => {
        el.url.value = item.url;
        el.clearBtn.classList.remove('hidden');
        fetchInfo(item.url, { force: true });
      });
      const img = document.createElement('img');
      img.alt = '';
      img.loading = 'lazy';
      img.src = item.thumbnail || `https://i.ytimg.com/vi/${item.videoId}/default.jpg`;
      const wrap = document.createElement('div');
      const t = document.createElement('div');
      t.className = 'ht';
      t.textContent = item.title || item.videoId;
      const a = document.createElement('div');
      a.className = 'ha';
      a.textContent = item.author || '';
      wrap.append(t, a);
      btn.append(img, wrap);
      el.history.appendChild(btn);
    }
  }
  el.clearHistory.addEventListener('click', () => {
    saveHistory([]);
    renderHistory();
  });

  // --------------------------------------------------------------- input ----
  el.fetchBtn.addEventListener('click', () => fetchInfo(el.url.value, { force: true }));

  el.url.addEventListener('input', () => {
    el.clearBtn.classList.toggle('hidden', !el.url.value.trim());
    clearError();
    clearTimeout(state.fetchTimer);
    const parsed = parseInput(el.url.value);
    if (!parsed) return;
    if (state.info && state.lastFetched === parsed.url) return;
    state.fetchTimer = setTimeout(() => fetchInfo(parsed.url), 650);
  });

  el.url.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      clearTimeout(state.fetchTimer);
      fetchInfo(el.url.value, { force: true });
    }
  });

  el.pasteBtn.addEventListener('click', async () => {
    try {
      const text = await navigator.clipboard.readText();
      if (text && text.trim()) {
        el.url.value = text.trim();
        el.url.dispatchEvent(new Event('input'));
        if (parseInput(text)) fetchInfo(text, { force: true });
      }
    } catch {
      el.url.focus();
      toast('Clipboard access blocked — paste with Ctrl+V.', 'info');
    }
  });

  el.clearBtn.addEventListener('click', () => {
    el.url.value = '';
    el.clearBtn.classList.add('hidden');
    state.info = null;
    state.url = '';
    state.lastFetched = '';
    clearError();
    hide(el.preview);
    hide(el.downloadBox);
    el.audio.pause();
    el.audio.removeAttribute('src');
    el.url.focus();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (state.dlAbort) state.dlAbort.abort();
      el.audio.pause();
    }
  });

  el.dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    el.dropZone.style.borderColor = 'rgba(255,45,85,.6)';
  });
  el.dropZone.addEventListener('dragleave', () => {
    el.dropZone.style.borderColor = '';
  });
  el.dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    el.dropZone.style.borderColor = '';
    const text = e.dataTransfer.getData('text/uri-list') || e.dataTransfer.getData('text/plain');
    if (text) {
      el.url.value = text.trim();
      el.url.dispatchEvent(new Event('input'));
      if (parseInput(text)) fetchInfo(text, { force: true });
    }
  });

  // ----------------------------------------------------------------- boot ---
  checkHealth();
  setInterval(checkHealth, 30000);
  renderHistory();
})();
</script>
</body>
</html>
