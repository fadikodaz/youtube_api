<!doctype html>
<!--
  Tool page template, rendered by lib/pages.js from lib/content.js.
  {{name}} = escaped text, {{{name}}} = HTML built by the renderer,
  {{origin}} = filled in per request. Not served directly.
-->
<html lang="{{lang}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>{{title}}</title>
    <meta name="description" content="{{description}}" />
    <link rel="canonical" href="{{origin}}{{path}}" />
    {{{robots}}}
    <meta name="theme-color" content="#FFD43B" />
    <script src="/theme.js"></script>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="YTPocket" />
    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:url" content="{{origin}}{{path}}" />
    <meta property="og:image" content="{{origin}}/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" href="/fonts/bricolage-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/app.css" />
    <script type="module" src="/app.js"></script>
    {{{jsonld}}}
  </head>
  <body data-tab="{{tab}}" data-platform="{{platform}}">
    <a class="skip" href="#url">Skip to the link field</a>

    {{{header}}}

    <main class="page" id="main">
      {{{crumbs}}}

      <section class="hero box" id="hero" aria-labelledby="headline">
        <h1 id="headline">{{h1}}</h1>
        <p class="lead">{{lead}}</p>

        <button class="paste-zone" id="pasteZone" type="button">
          <span class="paste-title"
            ><svg class="ic" aria-hidden="true"><use href="/icons.svg#i-clipboard-text" /></svg>Tap to paste link</span
          >
          <small>{{pasteHint}}</small>
        </button>

        <div class="intake" id="dropZone">
          <label class="visually-hidden" for="url">Video link</label>
          <span class="field-wrap">
            <input
              id="url"
              type="url"
              inputmode="url"
              autocomplete="off"
              autocapitalize="off"
              spellcheck="false"
              enterkeyhint="go"
              placeholder="Paste link here"
              aria-describedby="error"
            />
            <button class="field-paste" id="pasteBtn" type="button" aria-label="Paste link">
              <svg class="ic" aria-hidden="true"><use href="/icons.svg#i-clipboard-text" /></svg
              ><span class="field-paste-text">Paste</span>
            </button>
            <button class="clear" id="clearBtn" type="button" aria-label="Clear link" hidden>
              <svg class="ic" aria-hidden="true"><use href="/icons.svg#i-x" /></svg>
            </button>
          </span>
          <button class="cta" id="fetchBtn" type="button">{{cta}}</button>
        </div>
        <div class="alert" id="error" role="alert" hidden></div>
        <p class="terms">{{{terms}}}</p>
      </section>

      {{{tabs}}}

      <section class="result" id="result" aria-live="polite" aria-busy="false" hidden>
        <article class="video box" id="videoCard">
          <div class="skeleton" id="skeleton" hidden>
            <div class="sk sk-media"></div>
            <div class="sk sk-line"></div>
            <div class="sk sk-line short"></div>
            <span class="visually-hidden">Loading video details</span>
          </div>
          <div id="videoBody" hidden>
            <div class="screen" id="screen">
              <img id="thumb" alt="" decoding="async" />
              <span class="live" id="liveBadge" hidden>Live</span>
            </div>
            <div class="video-text">
              <h2 id="title"></h2>
              <p class="meta"><span id="site"></span> <span id="channel"></span> <span id="duration"></span></p>
              <button class="pill" id="thumbDl" type="button">
                <svg class="ic" aria-hidden="true"><use href="/icons.svg#i-image" /></svg>
                <span id="thumbDlText">Save thumbnail</span>
              </button>
            </div>
          </div>
        </article>

        <section class="sheet box" id="sheet" aria-label="Choose a format" hidden>
          <div class="grab" aria-hidden="true"></div>
          <div class="tabs" role="group" aria-label="Format type">
            <button id="tabVideo" type="button" aria-pressed="true">
              <svg class="ic" aria-hidden="true"><use href="/icons.svg#i-video-camera" /></svg>Video MP4
            </button>
            <button id="tabAudio" type="button" aria-pressed="false">
              <svg class="ic" aria-hidden="true"><use href="/icons.svg#i-music-notes" /></svg>Audio MP3
            </button>
          </div>
          <p class="sheet-note" id="sheetNote" hidden></p>

          <button class="cut-toggle" id="cutToggle" type="button" aria-expanded="false" aria-controls="cutPanel" hidden>
            Cut a part
          </button>
          <div class="cut" id="cutPanel" hidden>
            <label>
              From
              <input id="cutStart" type="text" inputmode="numeric" autocomplete="off" placeholder="0:00" />
            </label>
            <label>
              To
              <input id="cutEnd" type="text" inputmode="numeric" autocomplete="off" />
            </label>
            <button class="link-btn" id="cutClear" type="button">Whole video</button>
            <p class="cut-msg" id="cutMsg" aria-live="polite"></p>
          </div>

          <ul class="options" id="options"></ul>
        </section>
      </section>

      <div class="content" id="content">{{{content}}}</div>

      {{{related}}}
    </main>

    {{{footer}}}

    <div class="toasts" id="toasts"></div>
    <div class="visually-hidden" id="announcer" aria-live="polite"></div>
  </body>
</html>
