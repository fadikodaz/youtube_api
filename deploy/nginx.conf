# nginx site for the YouTube downloader.
# Installed by deploy/vps-setup.sh to /etc/nginx/sites-available/ytdl.
# Replace YOUR_DOMAIN, then get HTTPS with:  sudo certbot --nginx -d YOUR_DOMAIN
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # Only small JSON bodies are ever posted.
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Metadata lookups can take up to ~55 s on a slow YouTube day.
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # Finished files: stream straight through (large files, Range requests).
    location ~ ^/api/jobs/[0-9a-f]+/file$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
